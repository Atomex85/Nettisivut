<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomi Sankman — CV & Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal: #1A6B5A;
    --teal-mid: #24937C;
    --teal-light: #B8E4DA;
    --gold: #C9973A;
    --dark: #0E1A17;
    --mid: #2C3E39;
    --gray: #6B8880;
    --pale: #F2F7F5;
    --white: #FFFFFF;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
    padding-top: 70px; /* Tilaa kiinteälle navigaatiolle */
  }

  /* ── NAVIGAATIO ── */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(14, 26, 23, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-container {
    width: 100%;
    max-width: 980px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    color: var(--white);
    text-decoration: none;
  }

  .nav-brand span { color: var(--teal-mid); }

  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .nav-links a {
    color: var(--teal-light);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: var(--gold);
  }

  .hero-photo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--teal-mid);
    box-shadow: 0 0 30px rgba(36,147,124,0.4);
    flex-shrink: 0;
  }

  .hero-left {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  /* ── NOISE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── HERO ── */
  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 40px;
    padding: 56px 0 56px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    animation: fadeUp 0.8s ease both;
  }

  .hero-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(72px, 12vw, 130px);
    line-height: 0.9;
    letter-spacing: 2px;
    color: var(--white);
  }

  .hero-name span {
    display: block;
    color: var(--teal-mid);
  }

  .hero-tagline {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 18px;
  }

  .hero-contact {
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--gray);
    line-height: 2;
  }

  .hero-contact a {
    color: var(--teal-light);
    text-decoration: none;
    transition: color 0.2s;
  }

  .hero-contact a:hover { color: var(--white); }

  .badge-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 28px;
    animation: fadeUp 0.8s 0.15s ease both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--teal-light);
    background: rgba(26,107,90,0.15);
    backdrop-filter: blur(4px);
  }

  .badge.gold {
    color: var(--gold);
    border-color: rgba(201,151,58,0.3);
    background: rgba(201,151,58,0.08);
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 64px;
    margin-top: 64px;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--teal-mid);
    text-transform: uppercase;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(36,147,124,0.4), transparent);
  }

  /* ── JOB ENTRY ── */
  .job {
    padding: 24px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    position: relative;
  }

  .job:last-child { border-bottom: none; }

  .job::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 32px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal-mid);
    box-shadow: 0 0 12px var(--teal-mid);
  }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 6px;
  }

  .job-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.3;
  }

  .job-dates {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gray);
    white-space: nowrap;
    padding-top: 3px;
  }

  .job-company {
    font-size: 13px;
    font-weight: 500;
    color: var(--teal-light);
    margin-bottom: 12px;
  }

  .job-bullets {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .job-bullets li {
    font-size: 13.5px;
    color: rgba(255,255,255,0.65);
    padding-left: 16px;
    position: relative;
  }

  .job-bullets li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--teal-mid);
    font-size: 11px;
  }

  /* ── MAIN SECTION BLOCK ── */
  .main-section {
    margin-bottom: 52px;
    padding-left: 24px;
    border-left: 1px solid rgba(255,255,255,0.05);
  }

  /* ── SIDEBAR ── */
  .sidebar-block {
    margin-bottom: 40px;
  }

  .sidebar-block .section-title {
    font-size: 11px;
  }

  .skill-tag {
    display: inline-block;
    margin: 4px 4px 4px 0;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(26,107,90,0.2);
    border: 1px solid rgba(26,107,90,0.35);
    color: var(--teal-light);
    transition: all 0.2s;
  }

  .skill-tag:hover {
    background: rgba(26,107,90,0.4);
    transform: translateY(-1px);
  }

  .lang-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
  }

  .lang-row:last-child { border-bottom: none; }

  .lang-name { color: var(--white); font-weight: 500; }

  .lang-level {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--gray);
  }

  .lang-dots {
    display: flex;
    gap: 4px;
    margin-left: 10px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }

  .dot.filled { background: var(--teal-mid); box-shadow: 0 0 6px var(--teal-mid); }

  .info-line {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .info-line:last-child { border-bottom: none; }

  .info-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--teal-mid);
    min-width: 56px;
    padding-top: 2px;
  }

  .highlight-box {
    background: linear-gradient(135deg, rgba(26,107,90,0.2), rgba(36,147,124,0.08));
    border: 1px solid rgba(26,107,90,0.3);
    border-radius: 12px;
    padding: 18px 20px;
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    line-height: 1.7;
    font-style: italic;
  }

  .edu-block {
    padding: 16px 0;
  }

  .edu-degree {
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 4px;
  }

  .edu-school {
